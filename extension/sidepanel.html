<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agnes Code Agent</title>
    <link rel="icon" href="icons/icon-32.png" />
    <link rel="stylesheet" href="frame.css" />
  </head>
  <body>
    <div class="shell">
      <div class="bar">
        <span class="brand">
          <img src="icons/icon-32.png" alt="" />
          <strong>Agnes Code Agent</strong>
        </span>
        <span class="actions">
          <button id="tab" class="optional">Aba</button>
          <button id="opts">Config</button>
        </span>
        <span class="host" id="host"></span>
      </div>
      <iframe
        id="frame"
        allow="clipboard-read; clipboard-write"
        sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-downloads"
      ></iframe>
    </div>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
