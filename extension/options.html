<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Agnes Code Agent — Configuracao</title>
    <link rel="stylesheet" href="frame.css" />
    <style>
      main {
        max-width: 560px;
        margin: 40px auto;
        padding: 0 20px;
      }
      h1 {
        font-size: 20px;
      }
      p {
        font-size: 13px;
        color: #9aa7b2;
        line-height: 1.6;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #30363d;
        background: #0d1117;
        color: #e6edf3;
        font-family: ui-monospace, "JetBrains Mono", monospace;
        font-size: 13px;
      }
      button {
        margin-top: 12px;
        background: #2dd4bf;
        color: #05231f;
        border: 0;
        border-radius: 10px;
        padding: 10px 16px;
        font-weight: 600;
        cursor: pointer;
      }
      .ok {
        color: #2dd4bf;
        font-size: 12px;
        margin-left: 10px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Agnes Code Agent</h1>
      <p>
        URL do app hospedado (HTTPS). A chave da API Agnes e a URL base do provedor permanecem no
        servidor do app — a extensao nunca guarda segredos. Seu token do GitHub fica somente no
        armazenamento local do app.
      </p>
      <label for="url" style="font-size: 13px">URL do app</label>
      <input id="url" type="url" placeholder="https://seu-app.lovable.app" />
      <div><button id="save">Salvar</button><span class="ok" id="ok"></span></div>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
